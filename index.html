<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motiv</title>
<style>
  :root{
    --bg:#0b0c10; --card:#15171c; --text:#eef0f3; --muted:#a3a9b3; --accent:#5ee6a0; --border:#242730;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fafafa; --card:#ffffff; --text:#14161a; --muted:#5a6270; --accent:#0f9a62; --border:#e6e8ec; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{max-width:420px; padding:40px 24px; text-align:center;}
  .logo{width:72px; height:72px; border-radius:20px; background:linear-gradient(135deg,var(--accent),#2f8f6a); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:2rem; color:#06130c; margin:0 auto 20px;}
  h1{font-size:1.6rem; margin:0 0 8px;}
  p{color:var(--muted); margin:0 0 28px;}
  .links{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  a.btn{
    display:inline-block; padding:10px 18px; border-radius:999px; border:1px solid var(--border);
    color:var(--text); text-decoration:none; font-size:0.95rem; font-weight:600; background:var(--card);
  }
  a.btn:hover{border-color:var(--accent); color:var(--accent);}
  footer{margin-top:40px; font-size:0.8rem; color:var(--muted);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">M</div>
    <h1>Motiv</h1>
    <p>Bloqueie distrações, construa hábitos e mantenha sua sequência todos os dias.</p>
    <div class="links">
      <a class="btn" href="support.html">Suporte</a>
      <a class="btn" href="privacy.html">Privacidade</a>
    </div>
    <footer>© 2026 Angelica Lima</footer>
  </div>
</body>
</html>
